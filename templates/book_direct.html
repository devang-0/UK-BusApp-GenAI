{% extends "base.html" %}
{% block title %}UK BusApp - Book{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg border-0 rounded-4 p-4 mt-4 text-center">
            <h2 class="mb-4">Book a Bus Ticket</h2>
            <div class="alert alert-info">
                Please select a bus from the schedule to book your seat.<br>
                <a href="{{ url_for('home') }}" class="btn btn-primary mt-3 rounded-pill">Go to Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
