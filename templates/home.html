{% extends "base.html" %}
{% block title %}UK BusApp - Home{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg border-0 rounded-4 p-4 mt-4">
            <div class="card-body text-center">
                <h1 class="display-5 mb-3">Welcome to UK BusApp</h1>
                <p class="lead mb-4">Plan your UK bus journey with ease</p>
                <form action="/schedule" method="get" class="row g-3 justify-content-center">
                    <div class="col-md-12 col-lg-8">
                        <div class="input-group mb-3">
                            <span class="input-group-text">From</span>
                            <select class="form-select" name="source" required>
                                <option value="" disabled selected>Select source city</option>
                                {% for station in stations %}
                                    <option value="{{ station }}">{{ station }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="input-group mb-3">
                            <span class="input-group-text">To</span>
                            <select class="form-select" name="destination" required>
                                <option value="" disabled selected>Select destination city</option>
                                {% for station in stations %}
                                    <option value="{{ station }}">{{ station }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="input-group mb-3">
                            <span class="input-group-text">Date</span>
                            <input type="date" class="form-control" name="date" required>
                        </div>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill">Search Buses</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
