<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BusApp - Schedule</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4">Search Bus Schedule</h2>

        <form method="POST" class="row g-3">
            <div class="col-md-5">
                <input type="text" class="form-control" name="source" placeholder="Source City" required>
            </div>
            <div class="col-md-5">
                <input type="text" class="form-control" name="destination" placeholder="Destination City" required>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-success w-100">Search</button>
            </div>
        </form>

        <hr class="my-4">

        <h4 class="mb-3">Available Buses</h4>
        <table class="table table-bordered table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Source</th>
                    <th>Destination</th>
                    <th>Departure</th>
                    <th>Arrival</th>
                </tr>
            </thead>
            <tbody>
                {% for bus in buses %}
                <tr>
                    <td>{{ bus.source }}</td>
                    <td>{{ bus.destination }}</td>
                    <td>{{ bus.departure }}</td>
                    <td>{{ bus.arrival }}</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="4" class="text-center">No buses found for the selected route.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <a href="/" class="btn btn-secondary mt-3">Back to Home</a>
    </div>
</body>
</html>
