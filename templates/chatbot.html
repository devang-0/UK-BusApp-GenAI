{% extends "base.html" %}
{% block title %}UK BusApp - AI Chatbot{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">
        <div class="card shadow-lg border-0 rounded-4 p-4 mt-4">
            <h2 class="mb-4 text-center">AI Bus Assistant</h2>
            <div id="chat-box" style="height: 400px; overflow-y: scroll; border: 1px solid #dee2e6; border-radius: 8px; padding: 15px; background-color: #f8f9fa;">
                <div class="text-muted mb-2">Welcome! Ask me about bus schedules (e.g., "What buses from London to Birmingham?").</div>
            </div>
            <div class="input-group mt-3">
                <input type="text" id="user-input" class="form-control" placeholder="Type your message..." aria-label="Chat message">
                <button class="btn btn-primary" id="send-button">Send</button>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');


        function addMessage(sender, message) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('mb-2');
            if (sender === 'user') {
                messageDiv.innerHTML = `<p class="text-end text-primary mb-0"><strong>You:</strong> ${message}</p>`;
            } else {
                messageDiv.innerHTML = `<p class="text-start text-secondary mb-0"><strong>AI:</strong> ${message}</p>`;
            }
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }


        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            addMessage('user', message);
            userInput.value = '';

            try {
                const response = await fetch('/chatbot_api', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: message })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`HTTP error! status: ${response.status}, message: ${errorData.response}`);
                }

                const data = await response.json();
                addMessage('ai', data.response);
            } catch (error) {
                console.error('Error sending message to AI:', error);
                addMessage('ai', 'Oops! Something went wrong. Please try again.');
            }
        }


        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    });
</script>
{% endblock %}
